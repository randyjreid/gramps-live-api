[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gramps-live-api"
version = "0.0.0"
description = "Loopback HTTP API over a live, already-open Gramps family tree, plus a thin MCP client."
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-2.0-only"
license-files = ["LICENSE"]
classifiers = [
  "Development Status :: 1 - Planning",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Sociology :: Genealogy",
]
# EMPTY, and it is an invariant rather than a coincidence. The core -- the graph
# parser, the preview renderer, the host, the install doctor and `pii_guard` --
# runs on the standard library alone, and CI proves it: the core leg installs
# `.[dev]` and then refuses to continue if `mcp` is importable or if this
# distribution declares a single unconditional requirement.
#
# The MCP server is an OPTIONAL EXTRA below, not the core.
dependencies = []

[project.optional-dependencies]
# The official MCP SDK, and the only runtime dependency this project has of any
# kind. `docs/slice2-mcp.md` records what it costs -- measured, not estimated --
# and why the answer is still the SDK rather than a JSON-RPC loop of our own.
mcp = [
  # ⛔ UPPER BOUND, and it is a STOPGAP rather than the fix -- see issue #173.
  #
  # 2.1.1 discards the reason from a refusal. Measured, both versions, isolated
  # environments, same probe:
  #
  #   2.0.0  Error executing tool find_source: source X0001 is marked private in this tree
  #   2.1.1  Error executing tool find_source
  #
  # ⚠️ That is not cosmetic. `TargetIsPrivate` refuses a private target BY NAME
  # rather than reporting it absent, which is ruling 1's whole point -- and on
  # 2.1.1 the caller cannot tell "private" from "not found", so the distinction
  # this project is built to make is lost at the transport.
  #
  # The README tells a reader to run `pip install -e ".[mcp]"`, which is exactly
  # the command that resolved 2.1.1 before this bound existed.
  #
  # ⭐ The real fix is to stop depending on the SDK to carry a reason -- see
  # #173. Until the owner rules on that, this holds the floor, and
  # test_a_refusals_REASON_reaches_an_mcp_caller fails if the bound is relaxed
  # without the design change: a pin with no test is a pin someone relaxes.
  "mcp>=2.0.0,<2.1",
]
dev = [
  "mypy>=1.11",
  "pytest>=8.0",
  "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP", "W"]

[tool.mypy]
python_version = "3.10"
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
warn_unused_configs = true
strict_equality = true

[tool.pytest.ini_options]
testpaths = ["tests"]
