[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gramps-live-api"
version = "0.0.0"
description = "Loopback HTTP API over a live, already-open Gramps family tree, plus a thin MCP client."
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-2.0-only"
license-files = ["LICENSE"]
classifiers = [
  "Development Status :: 1 - Planning",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Sociology :: Genealogy",
]
# EMPTY, and it is an invariant rather than a coincidence. The core -- the
# schema, the write path, the CLI console and `pii_guard` -- runs on the
# standard library alone, and CI proves it: the core leg installs `.[dev]` and
# then refuses to continue if `mcp` is importable or if this distribution
# declares a single unconditional requirement.
#
# The MCP server is an OPTIONAL EXTRA below, not the core.
dependencies = []

[project.optional-dependencies]
# The official MCP SDK, and the only runtime dependency this project has of any
# kind. `docs/slice2-mcp.md` records what it costs -- measured, not estimated --
# and why the answer is still the SDK rather than a JSON-RPC loop of our own.
mcp = [
  "mcp>=2.0.0",
]
dev = [
  "mypy>=1.11",
  "pytest>=8.0",
  "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP", "W"]

[tool.mypy]
python_version = "3.10"
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
warn_unused_configs = true
strict_equality = true

[tool.pytest.ini_options]
testpaths = ["tests"]
