name: CI

on:
  push:
  pull_request:

# Two legs over the same tree, and the split is the point.
#
#   core  installs the dev tools and NOTHING ELSE, and proves it. `mcp` is not
#         importable there, so the core -- graph parser, preview renderer, host,
#         install doctor, pii_guard -- is measured on the standard library alone.
#   mcp   installs the optional extra, and proves the MCP tests actually RAN.
#
# ⚠️ Each leg exists to close the other's fail-open. A core leg that quietly
# gained a dependency would still be green; a suite that skips its MCP tests
# everywhere would also still be green. Neither is caught by reading a log, so
# neither is left to one.
jobs:
  core:
    name: core (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          # The suite asserts that every commit this repository publishes
          # reports nothing, and that assertion refuses to run over a
          # truncated history -- correctly, since a range scan over commits
          # that were never fetched reports clean over the part it cannot see.
          #
          # So on a shallow checkout it SKIPS rather than fails, and a skip is
          # invisible in a bare pytest summary: the job stays green while the
          # property goes unmeasured on every ordinary run. That is issue #31,
          # and it is why the Tests step below reports its skips by name.
          #
          # The guard job below has the same line for a different reason. This
          # one is about the suite being able to make an assertion; that one is
          # about the range scans having a history to resolve against.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # `.[dev]` and no extra: the dev tools, and not one runtime package.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # ⚠️ **The leg's own claim, checked rather than believed.** "It installs
      # `.[dev]`, so it must be dependency-free" is an inference from the
      # command, not an observation of the environment -- and a dependency that
      # arrived some other way (a dev tool growing one, a transitive pull, a
      # requirement quietly added back to `dependencies`) would leave this leg
      # green while it measured nothing.
      #
      # Two questions, because neither implies the other:
      #
      #   the ENVIRONMENT  is `mcp` importable here? It must not be, or the MCP
      #                    tests would run on the leg that exists to prove they
      #                    do not have to.
      #   the METADATA     does this distribution declare any UNCONDITIONAL
      #                    requirement? `dependencies = []` is the invariant, and
      #                    a requirement whose marker does not name an extra is
      #                    one -- whatever else the marker says.
      - name: Refuse a core leg that is not dependency-free
        run: |
          python - <<'PY'
          import importlib.util
          import sys
          from importlib.metadata import requires

          if importlib.util.find_spec("mcp") is not None:
              sys.exit("::error::'mcp' is importable on the dependency-free leg; it measures nothing")

          # A Requires-Dist line belongs to an extra iff its marker mentions
          # `extra ==`. Anything else -- bare, or conditioned on a platform, a
          # python version, anything at all -- is installed by `pip install .`
          # and so is a runtime dependency of the core.
          declared = requires("gramps-live-api") or []
          runtime = [r for r in declared if "extra ==" not in r]
          if runtime:
              sys.exit(f"::error::core declares runtime dependencies: {runtime}")

          print(f"dependency-free: 'mcp' absent, {len(declared)} requirement(s), all behind extras")
          PY

      - name: Lint
        run: ruff check .

      - name: Format
        run: ruff format --check .

      # ⚠️ **The core package only, and NOT because the MCP server is exempt.**
      # `mypy src` here reaches `gramps_live_api_mcp/server.py`, whose import of
      # `mcp` cannot be resolved on this leg. Measured, on an environment built
      # exactly like this one:
      #
      #   `mypy src`                       2 errors -- import-not-found, and
      #                                    no-any-return at `_configured`
      #   + ignore_missing_imports=mcp.*   1 error  -- the no-any-return survives
      #
      # That second error is the point. `_configured()` returns
      # `build_server(...)`, an `MCPServer`, where the declared return type is
      # the one-transport `Servable` protocol -- and that assignment is the type
      # checker confirming this server has exactly one transport. With the SDK
      # reduced to `Any` the check is not performed; `warn_return_any` says so
      # rather than passing quietly, which is correct and is not a fix. Silencing
      # it would need a `# type: ignore[no-any-return]` that `warn_unused_ignores`
      # then rejects on the leg where the SDK IS installed. There is no config
      # that satisfies both legs, because the two legs are asking different
      # questions.
      #
      # So the MCP server is type-checked where the types exist -- the `mcp` leg
      # below runs `mypy src`, the whole tree, against the real SDK. Nothing is
      # excluded from type checking; the module is checked once, in the only
      # place where the check means what its docstring says it means.
      - name: Types (core)
        run: mypy src/gramps_live_api

      # -rs names every skipped test and its reason in the report. A skip is
      # this suite's fail-closed answer to a platform it cannot observe, so a
      # skip nobody can see reads exactly like a pass -- which is how the
      # history assertion went unrun on every CI run without anyone noticing.
      #
      # `tests/unit/test_mcp_server.py` skips at module level here, by design and
      # by name. That it does NOT skip on the leg below is asserted there, not
      # read off this log.
      - name: Tests
        run: pytest -rs

  # The optional extra, installed. Same tree, same suite -- the difference is
  # one package, and everything this leg is for lives on the other side of it.
  mcp:
    name: mcp (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          # The same reason as the core leg: the suite's history assertion
          # refuses to run over a truncated history and skips instead, and a
          # skip is invisible in a bare summary. Issue #31.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,mcp]"

      # The whole tree, against the real SDK. See the core leg's Types step for
      # why the MCP server is checked here and only here.
      - name: Types
        run: mypy src

      # --junit-xml is what the next step reads. `-rs` stays: it is how a human
      # sees the same thing the next step enforces.
      #
      # ⚠️ **Written to RUNNER_TEMP, outside the checkout, deliberately.** This
      # repository's whole Phase 0 is about what its working tree contains, and
      # a report dropped in the root would be one more untracked artefact for
      # somebody to have to reason about -- against the hygiene tests, against
      # the guard's tracked-content scan, against `.gitignore`'s ordering rules.
      # None of it is load-bearing here and all of it is avoidable: the file has
      # no reason to be in the checkout, so it is not put there.
      - name: Tests
        run: pytest -rs --junit-xml="$RUNNER_TEMP/junit.xml"

      # ⚠️ **THE FAIL-OPEN THIS LEG EXISTS TO CLOSE.** Making the SDK optional
      # means the MCP tests skip when it is absent, and "skip when absent"
      # silently becomes "never run anywhere" the moment this leg stops
      # installing the extra -- a wrong package name, a renamed extra, a
      # resolution failure that pip reports and the job survives. **A skipped
      # test reads exactly like a passing one**, and this repository has already
      # paid for that once (#31).
      #
      # So the assertion is on the machine-readable report, not on the log, and
      # it fails the job:
      #
      #   the module contributed test cases    -- zero means it was skipped at
      #                                           module level, not collected,
      #                                           renamed, or moved
      #   none of them skipped                 -- scoped to this module, because
      #                                           other tests skip here for real
      #                                           reasons (no Gramps, no symlink
      #                                           privilege) and always will
      #   none of them errored                 -- a collection error is not a skip
      #
      # ⚠️ **Deliberately no expected COUNT.** A number here would be a count of
      # a file rather than of a property: it goes stale the next time somebody
      # adds a test, and a stale number that once matched reads as considered.
      # The property is "these ran", and "more than none, none skipped" is that
      # property exactly.
      - name: Refuse a run whose MCP tests did not run
        run: |
          python - <<'PY'
          import os
          import sys
          import xml.etree.ElementTree as ET

          # ⭐ Every module that skips itself when the extra is absent belongs
          # here. A module guarded that way and NOT listed skips on the core leg
          # and is proved by nothing on this one -- so it can quietly stop
          # running everywhere, which is #31 again.
          MODULES = (
              "tests.unit.test_mcp_server",
              "tests.unit.test_tool_descriptions_fit",
              "tests.unit.test_mcp_seam",
          )

          # A test case is this module's under EITHER shape, and both are
          # reached. A real test carries classname="tests.unit.test_mcp_server";
          # a module-level skip carries an EMPTY classname and the module in
          # `name`, so matching on classname alone would report the skip as
          # "contributed nothing" -- true, but naming the symptom rather than the
          # cause. Measured against a report from an environment without the
          # extra, which is how that shape was found rather than assumed.
          #
          # ⚠️ **The dot in the second test is load-bearing.** A bare
          # `startswith(MODULE)` also matches `..._renamed_elsewhere`, so this
          # whole step would go on passing while the module it names had been
          # renamed away -- a negative control caught exactly that. Equality, or
          # a class inside this module and nothing else.
          def belongs_to(case: ET.Element, module: str) -> bool:
              classname = case.get("classname") or ""
              return (
                  classname == module
                  or classname.startswith(f"{module}.")
                  or (case.get("name") or "") == module
              )

          # The path the step above wrote, read from the environment rather
          # than repeated as a literal -- two spellings of one path is how they
          # drift, and a missing file here would fail with a stack trace saying
          # nothing about the property. `os.environ[...]` raises if the runner
          # ever stops providing it, which is the right direction.
          root = ET.parse(os.path.join(os.environ["RUNNER_TEMP"], "junit.xml")).getroot()
          every = list(root.iter("testcase"))

          def name(case: ET.Element) -> str:
              return f"{case.get('classname')}::{case.get('name')}"

          # ⛔ Each module is judged on its OWN cases. Pooling them would let one
          # module's healthy run vouch for another that never collected.
          total = 0
          for module in MODULES:
              cases = [c for c in every if belongs_to(c, module)]
              skipped = [c for c in cases if c.find("skipped") is not None]
              errored = [c for c in cases if c.find("error") is not None]
              if not cases:
                  sys.exit(f"::error::{module} contributed no test cases; it did not run")
              if skipped:
                  sys.exit(f"::error::{module} skipped on the leg that installs the extra: {[name(c) for c in skipped]}")
              if errored:
                  sys.exit(f"::error::{module} errored rather than ran: {[name(c) for c in errored]}")
              total += len(cases)

          print(f"{total} MCP test cases ran across {len(MODULES)} modules; none skipped, none errored")
          PY

  pii-guard:
    name: pii-guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history: the guard scans the commits a push publishes,
          # not just the tip, and a shallow clone cannot resolve the range.
          fetch-depth: 0

      # UNCONDITIONAL, and it guards every arm below alike -- the branch push,
      # the pull request and the tag -- not the one it was written for. Each of
      # them resolves a range against history that has to actually be here.
      #
      # fetch-depth: 0 above supplies that history and a comment says it is
      # required, but a comment is not a check. git rev-list on a shallow clone
      # SUCCEEDS and returns only the commits that were fetched, so a checkout
      # that quietly stopped being complete would scan a truncated history and
      # report clean over the rest -- the same fail-open the range scans exist
      # to close, one level down.
      #
      # Fails closed on anything that is not exactly "false": an empty answer, a
      # non-zero exit, a word from a future Git. Written the other way round --
      # fail when the answer is "true" -- it would be a list of the known-bad
      # answers, and it would admit every answer nobody has thought of yet.
      - name: Refuse a checkout whose history is incomplete
        run: |
          set -euo pipefail
          shallow="$(git rev-parse --is-shallow-repository)"
          if [ "$shallow" != "false" ]; then
            echo "::error::the checkout is not provably complete (git says '${shallow}'); refusing to report a clean scan"
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # A push publishes every commit in it, not only the last one. Content
      # added in commit A and deleted in commit B is gone from the tip and
      # still reachable, so the range is what gets scanned.
      #
      # Every branch below ends in a range or in a failure. There is no path
      # that scans nothing: the guard itself also refuses a range covering no
      # commits, so a mistake here fails the job rather than passing it.
      #
      # ⚠️ Every value from the event arrives through env: and is used as a
      # QUOTED SHELL VARIABLE. None is substituted into the script text.
      #
      # An expression is replaced before Bash parses the body, so a value
      # containing a quote ends the quoting and the rest of the line becomes
      # code. A ref name is the reachable case -- Git permits an apostrophe in
      # a branch name -- and a branch name is not trusted input. A shell
      # variable is expanded after parsing, so its contents can never be read
      # as syntax.
      #
      # A TAG push is NOT a branch push and takes neither of these two ranges.
      # It resolves no baseline at all -- see the last step of this job for why
      # a tag cannot be given one, and what it scans instead. A tag at the
      # default-branch commit has an all-zero before-SHA and a tag ref name, so
      # routing it here resolved a range of NO commits: the guard refused it,
      # correctly, and this job failed on every ordinary tag push. That is what
      # the ref_type test below is for.
      - name: Determine the pushed range
        id: pushed
        if: github.event_name == 'push' && github.ref_type == 'branch'
        env:
          BEFORE: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REF_NAME: ${{ github.ref_name }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          empty='0000000000000000000000000000000000000000'

          if [ -n "$BEFORE" ] && [ "$BEFORE" != "$empty" ] \
             && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "range=${BEFORE}..${HEAD_SHA}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # No usable "before": this branch is new to the remote.
          if [ "$REF_NAME" = "$DEFAULT_BRANCH" ]; then
            # The default branch itself is new -- the repository was just
            # created. Everything reachable is new, so scan all of it.
            # Falling back to origin/<default>..HEAD here is what produced an
            # EMPTY range and a clean report over nothing.
            echo "range=${HEAD_SHA}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git cat-file -e "origin/${DEFAULT_BRANCH}^{commit}" 2>/dev/null; then
            echo "range=origin/${DEFAULT_BRANCH}..${HEAD_SHA}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "::error::cannot resolve the pushed commit range; refusing to report a clean scan"
          exit 1

      # This used to be a fork-only step, on the reasoning that a
      # same-repository pull request needs no range because every commit in it
      # arrived by a push and that push was range-scanned. Two things were
      # wrong with it: the tip of a pull request is a generated merge commit,
      # so content added and later removed on the branch is absent from it and
      # was never scanned by this event at all; and a check that leans on a
      # different event having run is not a check, it is an assumption.
      - name: Determine the pull request range
        id: pull_request
        # EVERY pull request, not only a fork's. A same-repository pull request
        # used to run the tip scan alone, so a branch that added genealogy data
        # in one commit and removed it in a later one came back clean: the
        # merge tip no longer held it, and the tip was all that was scanned.
        #
        # Scanning base..HEAD also means this check stands on its own. It does
        # not depend on the push check having run over those commits earlier.
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "::error::cannot resolve the pull request base; refusing to report a clean scan"
            exit 1
          fi
          echo "range=$(git merge-base "$BASE_SHA" HEAD)..HEAD" >> "$GITHUB_OUTPUT"

      # Deliberately no install step: installing would write build artefacts
      # into the checkout, and this job's whole point is to scan exactly what
      # the repository contains. The guard depends on nothing but the standard
      # library and Git.
      - name: Scan the pushed history for personal data
        if: github.event_name == 'push' && github.ref_type == 'branch'
        env:
          PYTHONPATH: src
          # Computed by the step above from event data, so it reaches the shell
          # the same way that data did: through the environment, never through
          # the script text.
          RANGE: ${{ steps.pushed.outputs.range }}
        run: python -m gramps_live_api.core.pii_guard --range "$RANGE" .

      - name: Scan the pull request history for personal data
        if: github.event_name == 'pull_request'
        env:
          PYTHONPATH: src
          RANGE: ${{ steps.pull_request.outputs.range }}
        run: python -m gramps_live_api.core.pii_guard --range "$RANGE" .

      # Everything the two range scans do not cover: a tag push, and any event
      # that is neither a push nor a pull request. Written as the complement
      # rather than as a list, so adding a trigger cannot silently leave an
      # event scanning nothing.
      #
      # EVERYTHING REACHABLE, not the tip. A tag publishes its target commit and
      # every ancestor, not merely the target's tree: content added in commit A
      # and deleted in commit B is absent from B's tree and still publicly
      # reachable through a tag on B. This step used to scan the tip, so that
      # tag came back clean over a family tree nobody had looked at.
      #
      # No baseline is computed, because a tag push carries none that can be
      # trusted -- a tag on history never pushed to any branch, a tag pushed
      # before its branch, a re-pointed tag, and the all-zero before-SHA all
      # defeat one, and a gate that cannot determine its scope must not report
      # clean. Whole history is always correct and is never empty, which is the
      # property the tip scan was originally chosen for. It costs a walk of the
      # history, which a tag push can afford.
      #
      # The same reasoning covers the other arm. An event that is neither a push
      # nor a pull request publishes whatever is reachable from its checkout
      # too, and there is no event data to narrow it with, so it takes the same
      # scan rather than a tip scan justified by nothing.
      #
      # This is a widening, never a narrowing: the guard scans tracked content
      # AND the range, so everything the tip scan read is still read.
      - name: Scan every reachable commit for personal data
        if: >-
          (github.event_name == 'push' && github.ref_type != 'branch') ||
          (github.event_name != 'push' && github.event_name != 'pull_request')
        env:
          PYTHONPATH: src
          # A literal, like PYTHONPATH: no event data reaches this step, so
          # there is nothing to compute and nothing to interpolate. It still
          # travels through env: and is quoted at the point of use, so the step
          # reads the same as the two above it.
          RANGE: HEAD
        run: python -m gramps_live_api.core.pii_guard --range "$RANGE" .
